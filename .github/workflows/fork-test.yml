name: Fork test build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-zen-extension
          path: |
            dist/*.zip
            dist/*.xpi
            dist/SHA256SUMS
